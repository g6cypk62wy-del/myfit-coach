<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Ton coach fitness personnel : entraînement, nutrition et progression, à partir de tes vraies données.">
  <meta name="theme-color" content="#F4F3EF" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0E0F11" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="MyFit">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="stylesheet" href="styles.css">
  <title>MyFit Coach</title>
  <script>
    // Applique le thème choisi avant l'affichage, pour éviter un flash de couleur.
    try {
      var t = JSON.parse(localStorage.getItem('myfit:settings') || '{}').theme;
      if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
    } catch (e) {}
  </script>
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <div id="app">
    <main id="main" tabindex="-1">
      <div class="boot" id="boot" role="status">
        <div class="spinner" aria-hidden="true"></div>
        <p>Chargement…</p>
      </div>
    </main>
    <nav class="tabbar" id="tabbar" aria-label="Navigation principale"></nav>
  </div>
  <div id="sheet-root"></div>
  <div id="toast-root" class="toast-root"></div>

  <noscript><p class="boot">MyFit Coach a besoin de JavaScript pour fonctionner.</p></noscript>
  <script>
    // Ouverte par double-clic (file://) : le navigateur bloque les modules JavaScript.
    if (location.protocol === 'file:') {
      document.getElementById('boot').innerHTML = '<p><strong>L’app doit être ouverte par une adresse web.</strong></p><p>Ouvrir le fichier directement ne fonctionne pas. Utilise l’adresse donnée par Claude (http://…:5181) ou la version en ligne.</p>';
    }
    // Si l'app n'a pas démarré au bout de 8 secondes, on le dit au lieu de tourner dans le vide.
    setTimeout(function () {
      var b = document.getElementById('boot');
      if (b) b.innerHTML = '<p><strong>L’app n’a pas pu démarrer.</strong></p><p>Vérifie ta connexion puis recharge la page.</p><button class="btn btn-primary" onclick="location.reload()">Recharger</button>';
    }, 8000);
  </script>
</body>
</html>
